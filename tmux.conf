# Capture the mouse: wheel scrolls scrollback, consistently across terminals
# (Ghostty, iTerm, ...). Trade-off: with mouse on, tmux grabs clicks, so to open a
# URL hold Shift+⌘ while clicking — BOTH together (Ghostty: Shift bypasses tmux's
# mouse grab so Ghostty handles the click locally, ⌘ is the open-link modifier).
# Neither alone works; mouse off would free plain clicks but break wheel-scroll.
set -g mouse on

# Tell tmux this terminal supports OSC 8 hyperlinks, so it passes them through
# instead of stripping them (e.g. Claude Code's PR badges, where the visible text
# isn't the URL). tmux does NOT auto-enable this from the terminfo `Hls` capability
# alone — verified on tmux 3.6b: terminfo Hls present but the `hyperlinks` feature
# stays off until declared here. (Plain URLs still work without this via Ghostty's
# own text autodetection; this is specifically for real OSC 8 hyperlinks.)
set -as terminal-features 'xterm-ghostty:hyperlinks'
